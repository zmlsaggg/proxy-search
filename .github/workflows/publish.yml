name: Build, publish to PyPI, and create GitHub release

on:
  push:
    branches:
      - "release/v1.0.0"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build Python distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install, test, and build
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e .
          python -m compileall -q main.py tests
          python -m unittest discover -s tests -v
          python -m build
          python -m twine check dist/*
      - name: Prepare source and script release assets
        run: |
          mkdir -p release-assets
          git archive --format=zip --prefix=proxy-search/ HEAD > release-assets/proxy-search-source.zip
          cp main.py release-assets/telegram-proxy-searcher.py
          cp README.md pyproject.toml requirements.txt install.bat start.bat release-assets/
          cat > release-assets/run-telegram-proxy-searcher.bat <<'BAT'
          @echo off
          chcp 65001 >nul
          cd /d "%~dp0"
          if exist "%~dp0TELEGRAM-PROXY-SEARCHER.exe" (
            "%~dp0TELEGRAM-PROXY-SEARCHER.exe" %*
          ) else (
            py -3 -m pip install -r "%~dp0requirements.txt"
            if errorlevel 1 python -m pip install -r "%~dp0requirements.txt"
            py -3 "%~dp0telegram-proxy-searcher.py" %*
            if errorlevel 1 python "%~dp0telegram-proxy-searcher.py" %*
          )
          BAT
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: release-source-assets
          path: release-assets/
          retention-days: 7

  windows-executable:
    name: Build Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build one-file executable
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install .
          pyinstaller --clean --onefile --name TELEGRAM-PROXY-SEARCHER main.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: dist/TELEGRAM-PROXY-SEARCHER.exe
          retention-days: 7

  publish:
    name: Publish to PyPI using Trusted Publishing
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/proxy-search/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release with source and executable
    needs: [build, windows-executable]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-source-assets
          path: release-assets/
      - uses: actions/download-artifact@v4
        with:
          name: windows-executable
          path: release-assets/
      - name: Create release and upload downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: TELEGRAM PROXY SEARCHER v1.0.0
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release-assets/*
