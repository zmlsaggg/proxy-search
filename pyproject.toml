[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-proxy-searcher"
version = "1.0.0"
description = "Search GitHub for Telegram proxy lists and verify HTTP/SOCKS proxies against Telegram."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx[socks]>=0.27,<1",
  "rich>=13.7,<15",
  "pyperclip>=1.9,<2",
]
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
  "Topic :: Internet",
  "Topic :: Utilities",
]

[project.scripts]
telegram-proxy-searcher = "main:main"

[project.urls]
Homepage = "https://github.com/zmlsaggg/proxy-search"
Repository = "https://github.com/zmlsaggg/proxy-search"
Issues = "https://github.com/zmlsaggg/proxy-search/issues"

[tool.setuptools]
py-modules = ["main"]
